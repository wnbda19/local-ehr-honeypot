services:
  postgres:
    image: postgres:16-alpine
    container_name: local-ehr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehr_user
      POSTGRES_PASSWORD: ehr_password
      POSTGRES_DB: ehr_local
    ports:
      - "5432:5432"
    volumes:
      - ehr_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr_user -d ehr_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ehr_postgres_data:
